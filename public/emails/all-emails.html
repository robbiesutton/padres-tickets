<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BenchBuddy — Email gallery</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 0;
    background: #1B1716;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    color: #fff;
    -webkit-font-smoothing: antialiased;
  }
  header {
    position: sticky;
    top: 0;
    z-index: 50;
    background: #2C2A2B;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    padding: 16px 24px;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }
  h1 {
    margin: 0;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  .count {
    font-size: 12px;
    color: rgba(255,255,255,0.5);
    margin-left: 4px;
  }
  .toggle {
    display: inline-flex;
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 8px;
    overflow: hidden;
  }
  .toggle button {
    appearance: none;
    border: 0;
    background: transparent;
    color: rgba(255,255,255,0.6);
    font-size: 12px;
    font-weight: 500;
    padding: 6px 12px;
    cursor: pointer;
    font-family: inherit;
  }
  .toggle button.active {
    background: #fff;
    color: #2C2A2B;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(640px, 1fr));
    gap: 32px;
    padding: 32px;
    max-width: 1600px;
    margin: 0 auto;
  }
  body.mobile .grid {
    grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
  }
  .card {
    display: flex;
    flex-direction: column;
    background: #2C2A2B;
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px;
    overflow: hidden;
  }
  .card-header {
    padding: 14px 18px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
    display: flex;
    align-items: baseline;
    gap: 10px;
  }
  .card-header .id {
    font-size: 11px;
    font-weight: 700;
    color: rgba(255,255,255,0.4);
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .card-header .label {
    font-size: 14px;
    font-weight: 600;
    color: #fff;
  }
  .iframe-wrap {
    background: #F5F4F2;
    display: flex;
    justify-content: center;
    padding: 24px 16px;
  }
  .iframe-wrap iframe {
    width: 600px;
    max-width: 100%;
    height: 900px;
    border: 0;
    background: #F5F4F2;
  }
  body.mobile .iframe-wrap iframe {
    width: 320px;
  }
  .open-link {
    padding: 10px 18px;
    border-top: 1px solid rgba(255,255,255,0.08);
    font-size: 12px;
  }
  .open-link a {
    color: rgba(255,255,255,0.5);
    text-decoration: none;
  }
  .open-link a:hover {
    color: #fff;
  }
</style>
</head>
<body>
<header>
  <h1>BenchBuddy emails <span class="count">10 templates + share-link preview</span></h1>
  <div class="toggle" role="group" aria-label="Width">
    <button id="btn-mobile" type="button">Mobile (320px)</button>
    <button id="btn-desktop" type="button" class="active">Desktop (600px)</button>
  </div>
</header>

<main class="grid" id="grid"></main>

<script>
  const EMAILS = [
    { id: '1',  label: 'Holder welcome',                  file: 'email-1-holder-welcome.html' },
    { id: '2',  label: 'Claimer welcome',                 file: 'email-2-claimer-welcome.html' },
    { id: '3',  label: 'Holder — game claimed',           file: 'email-3-holder-game-claimed.html' },
    { id: '4',  label: 'Claimer — claim confirmation',    file: 'email-4-claimer-claim-confirmation.html' },
    { id: '5',  label: 'Claimer — game day',              file: 'email-5-claimer-game-day.html' },
    { id: '6a', label: 'Holder — game day (claimed)',     file: 'email-6a-holder-gameday-claimed.html' },
    { id: '6b', label: 'Holder — game day (available)',   file: 'email-6b-holder-gameday-available.html' },
    { id: '6c', label: 'Holder — game day (going)',       file: 'email-6c-holder-gameday-going.html' },
    { id: '7',  label: 'Claimer — game unclaimed',        file: 'email-7-claimer-game-unclaimed.html' },
    { id: '8',  label: 'Holder — add payment info nudge', file: 'email-8-holder-add-payment-nudge.html' },
    { id: '★',  label: 'Share-link preview mockup',       file: 'share-link-preview-mockup.html' },
  ];

  const grid = document.getElementById('grid');
  EMAILS.forEach(async (e) => {
    const card = document.createElement('section');
    card.className = 'card';
    card.innerHTML = `
      <div class="card-header">
        <span class="id">#${e.id}</span>
        <span class="label">${e.label}</span>
      </div>
      <div class="iframe-wrap">
        <iframe loading="lazy" title="${e.label}"></iframe>
      </div>
      <div class="open-link"><a href="${e.file}" target="_blank" rel="noopener">Open in new tab →</a></div>
    `;
    grid.appendChild(card);
    // Fetch + inject via srcdoc to bypass X-Frame-Options: DENY set by Next.js.
    // srcdoc iframes inherit the parent's base URL, so absolute "/..." paths still resolve.
    try {
      const html = await fetch(e.file).then(r => r.text());
      card.querySelector('iframe').srcdoc = html;
    } catch {
      card.querySelector('.iframe-wrap').innerHTML =
        '<p style="color:#999;padding:40px;">Failed to load ' + e.file + '</p>';
    }
  });

  const btnMobile = document.getElementById('btn-mobile');
  const btnDesktop = document.getElementById('btn-desktop');
  btnMobile.addEventListener('click', () => {
    document.body.classList.add('mobile');
    btnMobile.classList.add('active');
    btnDesktop.classList.remove('active');
  });
  btnDesktop.addEventListener('click', () => {
    document.body.classList.remove('mobile');
    btnDesktop.classList.add('active');
    btnMobile.classList.remove('active');
  });
</script>
</body>
</html>
