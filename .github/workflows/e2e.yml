name: E2E Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel in-progress runs on the same branch to avoid burning parallel CI
# minutes and Mailosaur quota on rapid force-pushes.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npx prisma generate
      - run: npm test

  e2e:
    name: E2E tests (Playwright)
    needs: [unit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npx playwright install chromium --with-deps

      # Deploy preview to Vercel via REST API (deterministic URL from response)
      - name: Deploy to Vercel preview
        id: deploy
        run: |
          DEPLOYMENT=$(curl -sf -X POST "https://api.vercel.com/v13/deployments" \
            -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{
              "name": "benchbuddy",
              "gitSource": {
                "type": "github",
                "repoId": "${{ github.repository_id }}",
                "ref": "${{ github.head_ref || github.ref_name }}",
                "sha": "${{ github.sha }}"
              },
              "projectId": "${{ secrets.VERCEL_PROJECT_ID }}",
              "teamId": "${{ secrets.VERCEL_ORG_ID }}"
            }')
          URL="https://$(echo "$DEPLOYMENT" | jq -r '.url')"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      # Wait for preview to be warm (avoids cold-start false failures)
      - name: Wait for preview to be ready
        run: |
          for i in $(seq 1 24); do
            if curl -sf "${{ steps.deploy.outputs.url }}/api/auth/check-email" -o /dev/null -w "%{http_code}" | grep -qE "^(200|405)"; then
              echo "Preview is ready"; exit 0
            fi
            echo "Attempt $i/24 — waiting 5s..."; sleep 5
          done
          echo "Preview did not become ready in 2 minutes"; exit 1
        timeout-minutes: 3

      # Seed the Neon preview branch DB
      - name: Seed test database
        run: npx prisma migrate deploy && npm run db:seed:test
        env:
          DATABASE_URL: ${{ secrets.NEON_PREVIEW_DATABASE_URL }}
          TEST_EMAIL_DOMAIN: ${{ secrets.MAILOSAUR_SERVER_ID }}.mailosaur.net
          NODE_ENV: test

      # Run the suite
      - name: Run Playwright tests
        run: npx playwright test --project=chromium-desktop
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.deploy.outputs.url }}
          MAILOSAUR_API_KEY: ${{ secrets.MAILOSAUR_API_KEY }}
          MAILOSAUR_SERVER_ID: ${{ secrets.MAILOSAUR_SERVER_ID }}
          TEST_EMAIL_DOMAIN: ${{ secrets.MAILOSAUR_SERVER_ID }}.mailosaur.net
          STRIPE_SECRET_KEY_TEST: ${{ secrets.STRIPE_SECRET_KEY_TEST }}
          STRIPE_WEBHOOK_SECRET_TEST: ${{ secrets.STRIPE_WEBHOOK_SECRET_TEST }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  report:
    name: Notion reporter
    needs: [e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --legacy-peer-deps
      - uses: actions/download-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
      - name: Run reporter
        run: npx tsx scripts/verify-report.ts
        env:
          NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
          NOTION_VERIFICATION_DB_ID: ${{ secrets.NOTION_VERIFICATION_DB_ID }}
          NOTION_TASKS_DB_ID: ${{ secrets.NOTION_TASKS_DB_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERCEL_BLOB_RW_TOKEN: ${{ secrets.VERCEL_BLOB_RW_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          GITHUB_SHA: ${{ github.sha }}
