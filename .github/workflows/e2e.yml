name: E2E Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel in-progress runs on force-pushes to avoid burning Mailosaur quota
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npx prisma generate
      - run: npm test

  e2e:
    name: E2E tests (Playwright)
    needs: [unit]
    runs-on: ubuntu-latest
    # All env vars the Next.js app needs to start and handle requests.
    # Non-critical services (Resend, Stripe, AVFMS) get placeholder values —
    # the smoke suite doesn't trigger those code paths.
    env:
      DATABASE_URL: ${{ secrets.NEON_PREVIEW_DATABASE_URL }}
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET_CI }}
      NEXTAUTH_URL: http://localhost:3000
      RESEND_API_KEY: ci-placeholder
      STRIPE_SECRET_KEY: ci-placeholder
      STRIPE_PUBLISHABLE_KEY: ci-placeholder
      STRIPE_WEBHOOK_SECRET: ci-placeholder
      STRIPE_PRICE_ANNUAL_ID: ci-placeholder
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      AVFMS_API_KEY: ci-placeholder

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npx prisma generate
      - run: npx playwright install chromium --with-deps

      # Seed the Neon dev-clean branch with deterministic test data
      - name: Seed test database
        run: npx prisma migrate deploy && npm run db:seed:test
        env:
          TEST_EMAIL_DOMAIN: ${{ secrets.MAILOSAUR_SERVER_ID }}.mailosaur.net
          NODE_ENV: test

      # Build and start Next.js locally — no Vercel dependency
      - name: Build Next.js
        run: npm run build

      - name: Start Next.js
        run: npm run start &

      - name: Wait for app to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000 -o /dev/null; then
              echo "App ready on attempt $i"; exit 0
            fi
            echo "Waiting... ($i/30)"; sleep 3
          done
          echo "App did not start within 90 seconds"; exit 1
        timeout-minutes: 2

      - name: Run Playwright tests
        run: npx playwright test --project=chromium-desktop
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          MAILOSAUR_API_KEY: ${{ secrets.MAILOSAUR_API_KEY }}
          MAILOSAUR_SERVER_ID: ${{ secrets.MAILOSAUR_SERVER_ID }}
          TEST_EMAIL_DOMAIN: ${{ secrets.MAILOSAUR_SERVER_ID }}.mailosaur.net
          CRON_SECRET: ${{ secrets.CRON_SECRET }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  report:
    name: Notion reporter
    needs: [e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --legacy-peer-deps
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: playwright-report
          path: playwright-report/
      - name: Run reporter
        run: npx tsx scripts/verify-report.ts
        env:
          NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
          NOTION_VERIFICATION_DB_ID: ${{ secrets.NOTION_VERIFICATION_DB_ID }}
          NOTION_TASKS_DB_ID: ${{ secrets.NOTION_TASKS_DB_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERCEL_BLOB_RW_TOKEN: ${{ secrets.VERCEL_BLOB_RW_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          GITHUB_SHA: ${{ github.sha }}
